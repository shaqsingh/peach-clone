version: '3.8'

services:
  app:
    build: .
    container_name: peach-clone-app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    env_file: .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - DATABASE_URL=file:/app/data/prod.db

  caddy:
    image: caddy:latest
    container_name: peach-clone-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
